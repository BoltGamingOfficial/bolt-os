timeout: 5
default_entry: 1
interface_branding: BOLT OS
interface_branding_colour: D9A51C
interface_help_colour: 111111
term_foreground: 111111
term_background: D9A51C

/BOLT OS Live
    protocol: linux
    kernel_path: boot():/BOLT/boot/vmlinuz
    module_path: boot():/BOLT/boot/intel-ucode.img
    module_path: boot():/BOLT/boot/amd-ucode.img
    module_path: boot():/BOLT/boot/initramfs-bolt.img
    cmdline: loglevel=4 systemd.show_status=auto systemd.log_target=console console=tty0 console=ttyS0,115200 bolt.live=1 nvidia_drm.modeset=1
