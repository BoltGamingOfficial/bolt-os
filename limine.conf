timeout: 5
default_entry: /BOLT OS Live
serial: yes
interface_branding: BOLT OS
interface_branding_colour: 111111
interface_help_colour: 111111
wallpaper: boot():/BOLT/bolt-boot.png
wallpaper_style: stretched
term_foreground: FFF2C0
term_background: 80000000

/BOLT OS Live
    protocol: linux
    kernel_path: boot():/BOLT/boot/vmlinuz
    module_path: boot():/BOLT/boot/intel-ucode.img
    module_path: boot():/BOLT/boot/amd-ucode.img
    module_path: boot():/BOLT/boot/initramfs-bolt.img
    cmdline: loglevel=4 systemd.show_status=auto systemd.log_target=console console=tty0 console=ttyS0,115200n8 bolt.live=1 nvidia_drm.modeset=1
