name: BOLT ISO build

on:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'packages.x86_64'
      - 'limine.conf'
      - 'mkinitcpio/**'
      - 'rootfs-overlay/**'
      - 'branding/**'
      - 'tests/**'
      - 'README.md'
      - 'BUILDING.md'
      - 'RELEASE-NOTES.md'
      - '.github/workflows/build-iso.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version string for this development build
        required: true
        default: 0.2.0-dev
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed arch-install-scripts mkinitcpio squashfs-tools xorriso limine shellcheck git qemu-system-x86 edk2-ovmf xkeyboard-config tzdata
      - name: Check out source
        uses: actions/checkout@v4
      - name: Source, unit, and lint checks
        run: |
          bash tests/check-source.sh
          bash tests/test-first-run.sh
          bash tests/test-bolt-preset.sh
          shellcheck build.sh tests/*.sh \
            rootfs-overlay/usr/local/bin/bolt-preset \
            rootfs-overlay/usr/local/libexec/bolt-first-run \
            rootfs-overlay/usr/local/libexec/bolt-set-wallpaper-once \
            mkinitcpio/install/bolt_live mkinitcpio/hooks/bolt_live
      - name: Build BOLT ISO
        env:
          BOLT_VERSION: ${{ inputs.version || '0.2.0-dev' }}
          DELIVERY_DIR: ${{ github.workspace }}/BOLT-OS-DELIVERY
          WORK_DIR: /var/tmp/bolt-os-build
        run: bash ./build.sh
      - name: Probe UEFI boot in QEMU/OVMF
        env:
          QEMU_BOOT_TIMEOUT: 150
          BOLT_VERSION: ${{ inputs.version || '0.2.0-dev' }}
          DELIVERY_DIR: ${{ github.workspace }}/BOLT-OS-DELIVERY
          QEMU_REPORT_DIR: ${{ github.workspace }}/BOLT-OS-DELIVERY/testing
        run: bash tests/qemu-uefi-smoke.sh "$DELIVERY_DIR/iso/BOLT-OS-${BOLT_VERSION}-x86_64.iso"
      - name: Upload ISO, checksum, log, and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: BOLT-OS-${{ inputs.version || '0.2.0-dev' }}-x86_64
          path: BOLT-OS-DELIVERY/
          if-no-files-found: error
          retention-days: 14
