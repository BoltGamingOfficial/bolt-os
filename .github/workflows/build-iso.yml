name: BOLT ISO build

on:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'packages.x86_64'
      - 'limine.conf'
      - 'mkinitcpio/**'
      - 'rootfs-overlay/**'
      - 'branding/**'
      - 'tests/**'
      - 'README.md'
      - 'BUILDING.md'
      - 'RELEASE-NOTES.md'
      - '.github/workflows/build-iso.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version string for this development build
        required: true
        default: 0.3.1-dev
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed arch-install-scripts mkinitcpio squashfs-tools xorriso limine shellcheck git qemu-system-x86 edk2-ovmf xkeyboard-config tzdata clamav
      - name: Check out source
        uses: actions/checkout@v4
      - name: Source, unit, and lint checks
        run: |
          bash tests/check-source.sh
          bash tests/test-first-run.sh
          bash tests/test-bolt-preset.sh
          bash tests/test-apt-compat.sh
          shellcheck build.sh tests/*.sh \
            rootfs-overlay/usr/local/bin/bolt-preset \
            rootfs-overlay/usr/local/bin/apt \
            rootfs-overlay/usr/local/bin/bolt-help \
            rootfs-overlay/usr/local/bin/bolt-install-roblox \
            rootfs-overlay/usr/local/libexec/bolt-first-run \
            rootfs-overlay/usr/local/libexec/bolt-set-wallpaper-once \
            mkinitcpio/install/bolt_live mkinitcpio/hooks/bolt_live
      - name: Build BOLT ISO
        env:
          BOLT_VERSION: ${{ inputs.version || '0.3.1-dev' }}
          DELIVERY_DIR: ${{ github.workspace }}/BOLT-OS-DELIVERY
          WORK_DIR: /var/tmp/bolt-os-build
        run: bash ./build.sh
      - name: Refresh ClamAV signatures
        run: |
          sed -i '/^Example$/d' /etc/clamav/freshclam.conf
          freshclam --stdout --verbose
      - name: Scan built root filesystem and ISO payload
        run: |
          clamscan --recursive --infected --no-summary \
            /var/tmp/bolt-os-build/rootfs \
            "$GITHUB_WORKSPACE/BOLT-OS-DELIVERY/iso"
      - name: Probe UEFI boot in QEMU/OVMF
        env:
          QEMU_BOOT_TIMEOUT: 90
          BOLT_VERSION: ${{ inputs.version || '0.3.1-dev' }}
          DELIVERY_DIR: ${{ github.workspace }}/BOLT-OS-DELIVERY
          QEMU_REPORT_DIR: ${{ github.workspace }}/BOLT-OS-DELIVERY/testing
        run: bash tests/qemu-uefi-smoke.sh "$DELIVERY_DIR/iso/BOLT-OS-${BOLT_VERSION}-x86_64.iso"
      - name: Upload ISO as a direct, unzipped artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: BOLT-OS-DELIVERY/iso/BOLT-OS-${{ inputs.version || '0.3.1-dev' }}-x86_64.iso
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload SHA-256 checksum as a direct text artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: BOLT-OS-DELIVERY/checksums/BOLT-OS-${{ inputs.version || '0.3.1-dev' }}-x86_64.iso.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14
