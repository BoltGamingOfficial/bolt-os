name: Build and publish BOLT OS ISO

on:
  # Build a new experimental prerelease whenever the OS build inputs change.
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iso.yml'
      - 'build.sh'
      - 'packages.x86_64'
      - 'airootfs/**'
      - 'branding/**'
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (new tags create separate prereleases)
        required: true
        default: 0.1.0-dev
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools in the Arch container
        run: |
          pacman -Syu --noconfirm --needed archiso git shellcheck
          # The ISO build needs room for both the staged filesystem and final
          # ISO. Remove downloaded package archives after installing tools.
          pacman -Scc --noconfirm
          echo "Disk space after installing build tools and cleaning package cache:"
          df -h /
          df -h "$GITHUB_WORKSPACE" || true
          df -i /

      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n build.sh
          bash -n airootfs/usr/local/libexec/bolt-create-live-user
          bash -n airootfs/usr/local/libexec/bolt-set-wallpaper-once
          shellcheck build.sh airootfs/usr/local/libexec/bolt-create-live-user airootfs/usr/local/libexec/bolt-set-wallpaper-once

      - name: Reclaim unused hosted tool cache space
        run: |
          # This is an ephemeral GitHub-hosted runner. The Arch container
          # sees the runner's hosted tool cache at /__t; the build does not
          # use those preinstalled language/tool runtimes.
          if [[ -d /__t ]]; then
            echo "Hosted tool cache before cleanup:"
            du -sh /__t 2>/dev/null || true
            find /__t -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          fi
          echo "Disk space after runner-cache cleanup:"
          df -h /
          df -h "$GITHUB_WORKSPACE" || true

      - name: Build live ISO
        env:
          BOLT_VERSION: ${{ inputs.version || '0.1.0-dev' }}
        run: |
          echo "Disk space immediately before ISO build:"
          df -h /
          df -h "$GITHUB_WORKSPACE" || true
          bash ./build.sh

      - name: Upload ISO and checksums as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolt-os-${{ inputs.version || '0.1.0-dev' }}-x86_64
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Publish ISO in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || '0.1.0-dev' }}
          name: BOLT OS ${{ inputs.version || '0.1.0-dev' }}
          target_commitish: main
          prerelease: true
          draft: false
          generate_release_notes: true
          files: |
            out/*.iso
            out/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
