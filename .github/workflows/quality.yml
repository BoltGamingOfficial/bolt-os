name: BOLT source quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm --needed bash shellcheck openssl xkeyboard-config tzdata git
      - name: Check out source
        uses: actions/checkout@v4
      - name: Syntax and source policy tests
        run: |
          bash tests/check-source.sh
          bash tests/test-first-run.sh
          bash tests/test-bolt-preset.sh
      - name: ShellCheck
        run: |
          shellcheck build.sh tests/*.sh \
            rootfs-overlay/usr/local/bin/bolt-preset \
            rootfs-overlay/usr/local/libexec/bolt-first-run \
            rootfs-overlay/usr/local/libexec/bolt-set-wallpaper-once \
            mkinitcpio/install/bolt_live mkinitcpio/hooks/bolt_live
