name: Repository quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bash and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Check shell syntax
        run: bash -n build.sh tests/check-profile.sh tests/vm-smoke-test.sh tests/test-bolt-preset.sh airootfs/usr/local/bin/bolt-preset
      - name: Run ShellCheck
        run: shellcheck build.sh tests/check-profile.sh tests/vm-smoke-test.sh tests/test-bolt-preset.sh airootfs/usr/local/bin/bolt-preset
      - name: Validate package manifest and build policy
        run: |
          bash tests/check-profile.sh
          bash tests/test-bolt-preset.sh
